---
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Generate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Zip and Tar
        run: |
          mkdir bootstrap
          cp -r .config bootstrap
          cp -r alz bootstrap
          cp -r modules bootstrap
          cd bootstrap
          tar -cvzf ../bootstrap_modules.tar.gz .
          zip -r ../bootstrap_modules.zip .

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap_modules
          path: |
            bootstrap_modules.tar.gz
            bootstrap_modules.zip

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./bootstrap_modules.tar.gz
            ./bootstrap_modules.zip
